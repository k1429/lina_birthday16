<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 23rd Birthday, Ouidad! 🎉🐻</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('https://placehold.co/1920x1080/F0F8FF/FFC0CB?text=Cute+Birthday+Background'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            background-repeat: no-repeat; 
            background-color: #fcf3f6; 
        }

        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .animate-bounce-slow {
            animation: bounce-slow 3s infinite ease-in-out;
        }

        .hidden { display: none; }

        #password-screen.hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        #birthday-content:not(.hidden) {
            opacity: 1;
            transform: scale(1);
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }
        .animate-shake { animation: shake 0.5s ease-in-out; }

        .teddy-bear-icon {
            font-size: 2.5rem;
            margin: 0 10px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>

    <!-- شاشة كلمة المرور -->
    <div id="password-screen" class="bg-white p-10 rounded-3xl shadow-xl max-w-md w-full text-center transition-all duration-500 ease-in-out transform scale-100 opacity-100 border-4 border-pink-200">
        <h2 class="text-4xl font-bold text-purple-600 mb-6 drop-shadow-sm">Unlock Your Birthday Surprise! ✨</h2>
        <p class="text-gray-700 text-lg mb-8">Enter the secret password to reveal your special message for Ouidad.</p>
        <input type="password" id="password-input" placeholder="Enter password" class="w-full p-4 border-2 border-purple-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-pink-300 text-center text-xl text-gray-800 placeholder-gray-400">
        <button onclick="checkPassword()" class="mt-8 bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-600 hover:to-purple-600 text-white font-bold py-4 px-10 rounded-xl shadow-lg transition duration-300 ease-in-out transform hover:scale-105 active:scale-95">
            Unlock the Magic! 💖
        </button>
